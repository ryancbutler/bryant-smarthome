[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bryant-smarthome"
version = "0.1.0"
description = "CLI for Bryant HVAC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["keyring>=24,<26", "python-dotenv>=1,<2"]

[project.scripts]
bryant = "bryant_smarthome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
